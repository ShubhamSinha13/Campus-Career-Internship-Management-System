{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="container page-content"><div class="auth-card content-card wide-auth"><span class="eyebrow">CREATE ACCOUNT</span><h1>Student registration</h1><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-4"><label class="form-label">Date of Birth</label><input class="form-control" type="date" name="dob" required></div><div class="col-md-4"><label class="form-label">Department</label><select class="form-select" name="department_id" required>{% for department in departments %}<option value="{{ department.Department_ID }}">{{ department.Department_Name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Graduation Year</label><input class="form-control" type="number" name="graduation_year" required></div><div class="col-md-4"><label class="form-label">CGPA (0–10)</label><input class="form-control" type="number" min="0" max="10" step=".01" name="cgpa" required></div><div class="col-12"><label class="form-label">Skills and proficiency</label><div class="row g-2">{% for skill in skills %}<div class="col-md-6"><div class="skill-choice"><label><input type="checkbox" name="skills" value="{{ skill.Skill_ID }}"> {{ skill.Skill_Name }}</label><select name="proficiency_{{ skill.Skill_ID }}" class="form-select form-select-sm"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></div>{% endfor %}</div></div><div class="col-12"><button class="btn btn-primary">Create Student Account</button></div></form></div></div>
{% endblock %}
