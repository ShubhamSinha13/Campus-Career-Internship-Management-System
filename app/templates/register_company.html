{% extends "base.html" %}
{% block title %}Company Registration{% endblock %}
{% block content %}
<div class="container page-content"><div class="auth-card content-card"><span class="eyebrow">CREATE ACCOUNT</span><h1>Company registration</h1><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Company Name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Industry</label><input class="form-control" name="industry" required></div><div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" required></div><div class="col-md-6"><label class="form-label">Website</label><input class="form-control" type="url" name="website"></div><div class="col-md-6"><label class="form-label">Contact Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-12"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-12"><button class="btn btn-primary">Create Company Account</button></div></form></div></div>
{% endblock %}
