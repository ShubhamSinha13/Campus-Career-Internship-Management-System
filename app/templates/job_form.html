{% extends "base.html" %}
{% block title %}{% if edit_mode %}Edit Opportunity{% else %}Create Opportunity{% endif %}{% endblock %}
{% block content %}<div class="container page-content"><div class="auth-card content-card wide-auth"><span class="eyebrow">COMPANY TOOLS</span><h1>{% if edit_mode %}Edit opportunity{% else %}Create opportunity{% endif %}</h1><form method="post" class="row g-3"><div class="col-md-8"><label class="form-label">Job title</label><input class="form-control" name="job_title" value="{{ job.Job_Title if job else '' }}" required></div><div class="col-md-4"><label class="form-label">Job type</label><input class="form-control" name="job_type" value="{{ job.Job_Type if job else '' }}" placeholder="Internship" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4" required>{{ job.Description if job else '' }}</textarea></div><div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ job.Location if job else '' }}" required></div><div class="col-md-3"><label class="form-label">Minimum CGPA</label><input class="form-control" name="minimum_cgpa" type="number" min="0" max="10" step=".01" value="{{ job.Minimum_CGPA if job else '' }}" required></div><div class="col-md-3"><label class="form-label">Salary</label><input class="form-control" name="salary" type="number" min="0" step=".01" value="{{ job.Salary if job else '' }}" required></div><div class="col-md-4"><label class="form-label">Deadline</label><input class="form-control" name="deadline" type="date" value="{{ job.Application_Deadline if job else '' }}" required></div><div class="col-md-4"><label class="form-label">Recruiter</label><select class="form-select" name="recruiter_id" required>{% for recruiter in recruiters %}<option value="{{ recruiter.Recruiter_ID }}" {% if job and recruiter.Recruiter_ID == job.Recruiter_ID %}selected{% endif %}>{{ recruiter.Recruiter_Name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option {% if not job or job.Status == 'Open' %}selected{% endif %}>Open</option><option {% if job and job.Status == 'Closed' %}selected{% endif %}>Closed</option></select></div><div class="col-12"><label class="form-label">Required skills</label><div class="tag-list">{% for skill in skills %}<label class="skill-tag"><input type="checkbox" name="skills" value="{{ skill.Skill_ID }}" {% if skill.Skill_ID in selected_skill_ids|default([]) %}checked{% endif %}> {{ skill.Skill_Name }}</label>{% endfor %}</div></div><div class="col-12"><button class="btn btn-primary">{% if edit_mode %}Save Opportunity{% else %}Create Opportunity{% endif %}</button></div></form></div></div>{% endblock %}
