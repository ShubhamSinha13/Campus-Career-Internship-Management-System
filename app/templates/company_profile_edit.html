{% extends "base.html" %}
{% block title %}Edit Company Profile{% endblock %}
{% block content %}
<div class="container page-content"><div class="auth-card content-card wide-auth">
    <div class="d-flex justify-content-between align-items-start"><div><span class="eyebrow">COMPANY PROFILE</span><h1>Edit Company Profile</h1><p class="muted">Update your company information.</p></div><a class="back-link" href="{{ url_for('company_dashboard') }}">Back to dashboard</a></div>
    <form method="post" class="row g-3 mt-1">
        <div class="col-md-6"><label class="form-label">Company Name</label><input class="form-control" name="company_name" value="{{ company.Company_Name }}" required></div>
        <div class="col-md-6"><label class="form-label">Industry</label><input class="form-control" name="industry" value="{{ company.Industry }}" required></div>
        <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ company.Location }}" required></div>
        <div class="col-md-6"><label class="form-label">Website</label><input class="form-control" type="url" name="website" value="{{ company.Website or '' }}" placeholder="https://example.com"></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ company.Email or '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ company.Phone or '' }}" maxlength="20"></div>
        <div class="col-12"><button class="btn btn-primary">Save Changes</button></div>
    </form>
</div></div>
{% endblock %}
